# Netlify configuration file

[build]
  publish = "out"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22.8.0"

# Redirect rules
[[redirects]]
  from = "https://www.byshuhrat.com/*"
  to = "https://byshuhrat.com/:splat"
  status = 301
  force = true

# Headers for better performance
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    cache-control = "public,max-age=31536000,immutable"

[[headers]]
  for = "/opengraph-image"
  [headers.values]
    content-type = "image/png"
    cache-control = "public,max-age=0,must-revalidate"

[[headers]]
  for = "/og-image"
  [headers.values]
    content-type = "image/png"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    content-type = "application/xml; charset=utf-8"
    cache-control = "public,max-age=3600"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    content-type = "application/rss+xml; charset=utf-8"
    cache-control = "public,max-age=3600"

[[headers]]
  for = "/atom.xml"
  [headers.values]
    content-type = "application/atom+xml; charset=utf-8"
    cache-control = "public,max-age=3600"

# Post sources live in /public, so the export copies the raw markdown in
# beside the rendered page. Keep that duplicate out of the index.
[[headers]]
  for = "/:slug/index.md"
  [headers.values]
    X-Robots-Tag = "noindex"

# Next writes an RSC payload next to every page for client-side navigation.
# Useful to the router, not to search engines.
[[headers]]
  for = "/index.txt"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/:slug/index.txt"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-DNS-Prefetch-Control = "on"